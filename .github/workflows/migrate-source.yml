name: Migrer Hub Cuisine vers les fichiers source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Extraire le projet et remplacer le ZIP
        shell: bash
        run: |
          set -euo pipefail

          test -f HubCuisine_GitHub.zip

          rm -rf /tmp/hub-cuisine-migration
          mkdir -p /tmp/hub-cuisine-migration

          unzip -q HubCuisine_GitHub.zip -d /tmp/hub-cuisine-migration
          test -d /tmp/hub-cuisine-migration/HubCuisine_GitHub

          rsync -a /tmp/hub-cuisine-migration/HubCuisine_GitHub/ ./

          rm -f HubCuisine_GitHub.zip

          # Corrige la plateforme macOS du package utilisé par les tests Swift.
          python3 - <<'PY'
          from pathlib import Path

          path = Path("BrendonHubCuisine.swiftpm/Package.swift")
          text = path.read_text()

          needle = 'let package = Package(\n    name: "HubCuisineCore",\n'
          replacement = 'let package = Package(\n    name: "HubCuisineCore",\n    platforms: [.macOS(.v10_15)],\n'

          if "platforms: [.macOS(.v10_15)]" not in text:
              if needle not in text:
                  raise SystemExit("Impossible de trouver le package HubCuisineCore.")
              text = text.replace(needle, replacement, 1)
              path.write_text(text)
          PY

          # Remplace l'ancien workflow par une compilation directe des fichiers du dépôt.
          mkdir -p .github/workflows
          cat > .github/workflows/build-ipad.yml <<'DIRECT_WORKFLOW'
          name: Compiler Hub Cuisine pour iPad

          on:
            workflow_dispatch:
            push:
              branches:
                - main
              paths:
                - 'BrendonHubCuisine.swiftpm/**'
                - 'BuildSupport/**'
                - '.github/workflows/build-ipad.yml'

          permissions:
            contents: read

          jobs:
            build:
              runs-on: macos-15
              timeout-minutes: 30

              env:
                HOMEBREW_NO_AUTO_UPDATE: '1'
                HOMEBREW_NO_INSTALL_CLEANUP: '1'

              steps:
                - name: Récupérer le dépôt
                  uses: actions/checkout@v7
                  with:
                    persist-credentials: false

                - name: Préparer Xcode et le projet
                  shell: bash
                  run: |
                    set -euo pipefail

                    mkdir -p build

                    xcodebuild -version
                    xcrun swift --version

                    if ! command -v xcodegen >/dev/null 2>&1; then
                      brew install xcodegen
                    fi

                    xcodegen --version

                    xcodegen generate \
                      --spec BuildSupport/project.yml \
                      --project BuildSupport

                    plutil -lint \
                      BuildSupport/Info.plist \
                      BuildSupport/HubCuisine.xcodeproj/project.pbxproj

                    # Chaque build reçoit un numéro différent pour faciliter les mises à jour.
                    /usr/libexec/PlistBuddy \
                      -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" \
                      BuildSupport/Info.plist

                    python3 BuildSupport/prepare_core_tests.py

                - name: Tester la logique métier
                  shell: bash
                  run: |
                    set -euo pipefail

                    xcrun swift test \
                      --package-path build/CorePackage \
                      --jobs 2 \
                      2>&1 | tee build/core-tests.log

                - name: Compiler Hub Cuisine pour iPhone et iPad
                  shell: bash
                  run: |
                    set -euo pipefail

                    xcodebuild \
                      -project BuildSupport/HubCuisine.xcodeproj \
                      -scheme HubCuisine \
                      -configuration Release \
                      -sdk iphoneos \
                      -destination 'generic/platform=iOS' \
                      -derivedDataPath build/DerivedData \
                      CODE_SIGNING_ALLOWED=NO \
                      CODE_SIGNING_REQUIRED=NO \
                      CODE_SIGN_IDENTITY="" \
                      build \
                      2>&1 | tee build/xcodebuild.log

                    test -d build/DerivedData/Build/Products/Release-iphoneos/HubCuisine.app

                - name: Préparer l’IPA
                  shell: bash
                  run: |
                    set -euo pipefail

                    APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/HubCuisine.app"

                    rm -rf build/Payload
                    mkdir -p build/Payload

                    cp -R "$APP_PATH" build/Payload/

                    (
                      cd build
                      /usr/bin/zip -qry HubCuisine-unsigned.ipa Payload
                      shasum -a 256 HubCuisine-unsigned.ipa > HubCuisine-unsigned.sha256
                    )

                    test -f build/HubCuisine-unsigned.ipa
                    ls -lh build/HubCuisine-unsigned.ipa
                    cat build/HubCuisine-unsigned.sha256

                - name: Fournir Hub Cuisine
                  uses: actions/upload-artifact@v7
                  with:
                    name: HubCuisine-IPA-a-signer
                    path: |
                      build/HubCuisine-unsigned.ipa
                      build/HubCuisine-unsigned.sha256
                      INSTALLATION_IPAD.md
                      RENOUVELLEMENT_AUTO.md
                    if-no-files-found: error
                    retention-days: 7
                    compression-level: 0

                - name: Conserver les diagnostics
                  if: always()
                  uses: actions/upload-artifact@v7
                  with:
                    name: HubCuisine-journaux
                    path: |
                      build/core-tests.log
                      build/xcodebuild.log
                    if-no-files-found: ignore
                    retention-days: 3
          DIRECT_WORKFLOW

          # Ce workflow ne sert qu'une fois : il se retire lui-même du dépôt.
          rm -f .github/workflows/migrate-source.yml

      - name: Enregistrer la migration sur main
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Aucun changement à enregistrer."
            exit 0
          fi

          git commit -m "Migrate Hub Cuisine to direct source files"
          git push origin HEAD:main
