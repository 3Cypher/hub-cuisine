name: Compiler Hub Cuisine pour iPad

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'BrendonHubCuisine.swiftpm/**'
      - 'BuildSupport/**'
      - '.github/workflows/build-ipad.yml'

permissions:
  contents: read

concurrency:
  group: hub-cuisine-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Préparer Xcode et le projet
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build

          xcodebuild -version
          xcrun swift --version

          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

          xcodegen --version

          xcodegen generate \
            --spec BuildSupport/project.yml \
            --project BuildSupport

          plutil -lint \
            BuildSupport/Info.plist \
            BuildSupport/HubCuisine.xcodeproj/project.pbxproj

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" \
            BuildSupport/Info.plist

          python3 BuildSupport/prepare_core_tests.py

      - name: Tester la logique métier
        shell: bash
        run: |
          set -euo pipefail

          xcrun swift test \
            --package-path build/CorePackage \
            --jobs 2 \
            2>&1 | tee build/core-tests.log

      - name: Compiler Hub Cuisine pour iPhone et iPad
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project BuildSupport/HubCuisine.xcodeproj \
            -scheme HubCuisine \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            2>&1 | tee build/xcodebuild.log

          test -d build/DerivedData/Build/Products/Release-iphoneos/HubCuisine.app

      - name: Préparer l’IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/HubCuisine.app"

          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/

          (
            cd build
            /usr/bin/zip -qry HubCuisine-unsigned.ipa Payload
            shasum -a 256 HubCuisine-unsigned.ipa > HubCuisine-unsigned.sha256
          )

          test -f build/HubCuisine-unsigned.ipa
          ls -lh build/HubCuisine-unsigned.ipa
          cat build/HubCuisine-unsigned.sha256

      - name: Fournir Hub Cuisine
        uses: actions/upload-artifact@v7
        with:
          name: HubCuisine-IPA-a-signer
          path: |
            build/HubCuisine-unsigned.ipa
            build/HubCuisine-unsigned.sha256
            INSTALLATION_IPAD.md
            RENOUVELLEMENT_AUTO.md
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Conserver les diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: HubCuisine-journaux
          path: |
            build/core-tests.log
            build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 3
