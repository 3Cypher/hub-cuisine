name: Compiler Hub Cuisine pour iPad

on:
  workflow_dispatch:
  push:
    paths:
      - 'HubCuisine_GitHub.zip'
      - '.github/workflows/build-ipad.yml'

permissions:
  contents: read

concurrency:
  group: hub-cuisine-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event.repository.private == false }}
    runs-on: macos-15
    timeout-minutes: 30

    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'

    defaults:
      run:
        shell: bash
        working-directory: build-input/HubCuisine_GitHub

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Décompresser Hub Cuisine
        working-directory: .
        run: |
          set -euo pipefail

          test -f HubCuisine_GitHub.zip

          rm -rf build-input
          mkdir -p build-input

          unzip -q HubCuisine_GitHub.zip -d build-input

          test -f build-input/HubCuisine_GitHub/BuildSupport/project.yml

      - name: Préparer Xcode et le projet
        run: |
          set -euo pipefail

          mkdir -p build

          echo "=== Xcode ==="
          xcodebuild -version

          echo "=== Swift ==="
          xcrun swift --version

          echo "=== XcodeGen ==="
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

          xcodegen --version

          echo "=== Génération du projet Xcode ==="
          xcodegen generate \
            --spec BuildSupport/project.yml \
            --project BuildSupport

          echo "=== Vérification des fichiers ==="
          plutil -lint \
            BuildSupport/Info.plist \
            BuildSupport/HubCuisine.xcodeproj/project.pbxproj

          echo "=== Préparation des tests ==="
          python3 BuildSupport/prepare_core_tests.py

      - name: Tester la logique métier
        continue-on-error: true
        run: |
          set -euo pipefail

          echo "Les tests Swift sont utiles mais ne doivent pas bloquer la compilation iOS."

          MACOSX_DEPLOYMENT_TARGET=10.15 \
          xcrun swift test \
            --package-path build/CorePackage \
            --jobs 2 \
            2>&1 | tee build/core-tests.log

      - name: Compiler Hub Cuisine pour iPhone et iPad
        run: |
          set -euo pipefail

          echo "=== Compilation iOS ==="

          xcodebuild \
            -project BuildSupport/HubCuisine.xcodeproj \
            -scheme HubCuisine \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            2>&1 | tee build/xcodebuild.log

          echo "=== Recherche de l'application compilée ==="

          find build/DerivedData \
            -type d \
            -name "*.app" \
            -print

      - name: Préparer l’IPA
        run: |
          set -euo pipefail

          echo "=== Création de l'IPA non signée ==="

          python3 BuildSupport/package_ipa.py

          echo "=== Vérification ==="

          test -f build/HubCuisine-unsigned.ipa

          ls -lh build/HubCuisine-unsigned.ipa

          if [ -f build/HubCuisine-unsigned.sha256 ]; then
            cat build/HubCuisine-unsigned.sha256
          fi

      - name: Fournir Hub Cuisine
        uses: actions/upload-artifact@v7
        with:
          name: HubCuisine-IPA-a-signer
          path: |
            build-input/HubCuisine_GitHub/build/HubCuisine-unsigned.ipa
            build-input/HubCuisine_GitHub/build/HubCuisine-unsigned.sha256
            build-input/HubCuisine_GitHub/INSTALLATION_IPAD.md
            build-input/HubCuisine_GitHub/RENOUVELLEMENT_AUTO.md
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Conserver les diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: HubCuisine-journaux
          path: |
            build-input/HubCuisine_GitHub/build/core-tests.log
            build-input/HubCuisine_GitHub/build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 3
