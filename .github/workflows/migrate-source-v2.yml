name: Migrer Hub Cuisine vers les fichiers source v2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Extraire les sources sans toucher aux workflows
        shell: bash
        run: |
          set -euo pipefail

          test -f HubCuisine_GitHub.zip

          rm -rf /tmp/hub-cuisine-migration
          mkdir -p /tmp/hub-cuisine-migration

          unzip -q HubCuisine_GitHub.zip -d /tmp/hub-cuisine-migration
          test -d /tmp/hub-cuisine-migration/HubCuisine_GitHub

          # IMPORTANT :
          # on n'écrit jamais dans .github/workflows depuis ce workflow,
          # car GitHub bloque cette opération sans permission "workflows".
          rsync -a \
            --exclude='.github/' \
            /tmp/hub-cuisine-migration/HubCuisine_GitHub/ ./

          # Corrige le package macOS généré pour les tests.
          python3 - <<'PY'
          from pathlib import Path

          p = Path("BuildSupport/prepare_core_tests.py")
          s = p.read_text()

          old = 'let package = Package(name: "HubCuisineCore", targets: ['
          new = 'let package = Package(name: "HubCuisineCore", platforms: [.macOS(.v10_15)], targets: ['

          if new not in s:
              if old not in s:
                  raise SystemExit("Impossible de corriger prepare_core_tests.py")
              s = s.replace(old, new, 1)
              p.write_text(s)
          PY

          # Corrige également la commande lipo du script historique.
          python3 - <<'PY'
          from pathlib import Path

          p = Path("BuildSupport/package_ipa.py")
          s = p.read_text()

          old = "subprocess.run(['xcrun', 'lipo', '-verify_arch', 'arm64', str(executable)], check=True)"
          new = "subprocess.run(['xcrun', 'lipo', str(executable), '-verify_arch', 'arm64'], check=True)"

          if new not in s:
              if old not in s:
                  raise SystemExit("Impossible de corriger package_ipa.py")
              s = s.replace(old, new, 1)
              p.write_text(s)
          PY

      - name: Enregistrer uniquement les fichiers de l’application
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # On laisse volontairement HubCuisine_GitHub.zip en place pour cette étape.
          # Il pourra être supprimé plus tard, une fois le nouveau workflow installé.
          git add \
            .gitignore \
            README.md \
            BrendonHubCuisine.swiftpm \
            BuildSupport \
            INSTALLATION_IPAD.md \
            RENOUVELLEMENT_AUTO.md

          if git diff --cached --quiet; then
            echo "Aucun changement à enregistrer."
            exit 0
          fi

          git commit -m "Add Hub Cuisine source files"
          git push origin HEAD:main
